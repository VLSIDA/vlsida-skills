apiVersion: v1
kind: Pod
metadata:
  # Pod name must start with the submitter's CruzID (e.g., jdoe-dev-shell)
  # so cluster admins and other users can identify the owner at a glance.
  name: __CRUZID__-__POD_NAME__
  namespace: __NAMESPACE__
  labels:
    app: __APP_LABEL__
    user: __CRUZID__
spec:
  containers:
  - name: workspace
    image: ubuntu:24.04
    command: ["sleep", "infinity"]
    volumeMounts:
    - name: data
      mountPath: /data
    resources:
      # Illustrative values; measure the interactive workload before sizing.
      requests:
        memory: 8Gi
        cpu: 4
        ephemeral-storage: 10Gi
      limits:
        memory: 8Gi
        cpu: 4
        ephemeral-storage: 10Gi
    # For GPU access, add nvidia.com/gpu: 1 to BOTH existing requests and
    # limits maps above, retaining the CPU, memory and storage entries.
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: __PVC_NAME__
  restartPolicy: Never
